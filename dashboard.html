<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Traffic</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel2: #f1f3f6; --text: #1d2330; --muted: #6b7280; --line: #e2e5ea;
  --you: #2563eb; --you-bg: #eaf1ff;
  --model: #6d28d9; --model-bg: #f4f0fd;
  --call: #b45309; --call-bg: #fff6e6; --call-line: #f5c46b;
  --res: #15803d; --res-bg: #ecfaf0; --res-line: #8fd8a8;
  --err: #dc2626; --err-bg: #fdecec; --err-line: #f2a3a3;
  --warn: #a16207; --warn-bg: #fdf6d8;
  --rem: #6b7280; --rem-bg: #f3f4f6;
  --jkey: #7c3aed; --jstr: #047857; --jnum: #b45309; --jlit: #2563eb;
  --mark: #fde68a;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --panel: #171b23; --panel2: #1e232d; --text: #e3e7ee; --muted: #8b93a3; --line: #2a303c;
    --you: #7aa7ff; --you-bg: #17233d; --model: #b69cff; --model-bg: #221c36;
    --call: #f0b45a; --call-bg: #2b2213; --call-line: #6b4e1d;
    --res: #5fd38a; --res-bg: #12261a; --res-line: #24573a;
    --err: #ff7b7b; --err-bg: #331617; --err-line: #6e2a2a;
    --warn: #e9c45a; --warn-bg: #2e2810; --rem: #9aa1ad; --rem-bg: #1c2029;
    --jkey: #c4a7ff; --jstr: #6fdc9f; --jnum: #f0b45a; --jlit: #7aa7ff; --mark: #6b5a12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --panel: #171b23; --panel2: #1e232d; --text: #e3e7ee; --muted: #8b93a3; --line: #2a303c;
  --you: #7aa7ff; --you-bg: #17233d; --model: #b69cff; --model-bg: #221c36;
  --call: #f0b45a; --call-bg: #2b2213; --call-line: #6b4e1d;
  --res: #5fd38a; --res-bg: #12261a; --res-line: #24573a;
  --err: #ff7b7b; --err-bg: #331617; --err-line: #6e2a2a;
  --warn: #e9c45a; --warn-bg: #2e2810; --rem: #9aa1ad; --rem-bg: #1c2029;
  --jkey: #c4a7ff; --jstr: #6fdc9f; --jnum: #f0b45a; --jlit: #7aa7ff; --mark: #6b5a12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { overflow-anchor: none; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
button, select, input { font: inherit; color: inherit; }
code, pre, .mono { font-family: var(--mono); font-size: 12.5px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }

/* header */
header { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 8px 16px; display: flex; flex-direction: column; gap: 6px; }
.hrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
h1 { font-size: 15px; margin: 0; }
.live { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
.live.on .dot { background: var(--res); box-shadow: 0 0 0 3px color-mix(in srgb, var(--res) 25%, transparent); }
.live.wait .dot { background: var(--warn); }
.stat { color: var(--muted); white-space: nowrap; }
.stat b { color: var(--text); font-weight: 600; }
.errcount { cursor: pointer; border: 0; background: none; padding: 0; color: var(--muted); }
.errcount.has b { color: var(--err); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--call-line); background: var(--call-bg); color: var(--call); border-radius: 999px;
  padding: 0 8px; font-size: 12px; cursor: pointer; }
.chip.on { background: var(--call); color: var(--panel); }
.controls input[type=search] { width: 220px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); }
.controls select { padding: 2px 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); }
.controls label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
.btn { border: 1px solid var(--line); background: var(--panel2); border-radius: 6px; padding: 1px 8px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.legend { display: flex; gap: 10px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; background: var(--c); }

/* feed */
main { max-width: 1280px; margin: 0 auto; padding: 12px 16px 80px; }
.empty { color: var(--muted); text-align: center; padding: 60px 0; }
.row { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid transparent; border-radius: 8px;
  margin-bottom: 8px; }
.row.err { border-left-color: var(--err); }
.row.focus { outline: 2px solid var(--you); outline-offset: 1px; }
.row.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 4px var(--call); } to { box-shadow: 0 0 0 0 transparent; } }
.head { padding: 7px 10px; cursor: pointer; min-width: 0; }
.head:focus { outline: none; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12.5px; color: var(--muted); }
.meta .seq { color: var(--text); font-weight: 600; }
.tag { border-radius: 4px; padding: 0 6px; font-size: 12px; font-weight: 600; color: #fff; }
.badge { border-radius: 4px; padding: 0 6px; font-size: 12px; border: 1px solid var(--line); background: var(--panel2); color: var(--muted); white-space: nowrap; }
.badge.ok { color: var(--res); border-color: var(--res-line); background: var(--res-bg); }
.badge.bad { color: var(--err); border-color: var(--err-line); background: var(--err-bg); font-weight: 600; }
.badge.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
.badge.mk { color: var(--you); border-color: color-mix(in srgb, var(--you) 40%, transparent); background: var(--you-bg); }
.badge.call { color: var(--call); border-color: var(--call-line); background: var(--call-bg); }
.reddot { width: 8px; height: 8px; border-radius: 50%; background: var(--err); display: inline-block; }
.spin { width: 11px; height: 11px; border: 2px solid var(--line); border-top-color: var(--you); border-radius: 50%;
  display: inline-block; animation: spin .8s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }
.pv { margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; }
.pv .arrow { color: var(--muted); display: inline-block; width: 16px; }
.k-you { color: var(--you); } .k-model { color: var(--model); } .k-call { color: var(--call); }
.k-res { color: var(--res); } .k-err { color: var(--err); } .k-muted { color: var(--muted); }
.pv .k-call, .pv .k-res, .pv .k-err { font-family: var(--mono); font-size: 12.5px; }
.sep { color: var(--muted); padding: 0 6px; }
.row.bg { opacity: .78; }
.row.bg .head { padding: 4px 10px; }
.row.bg .pv { font-size: 12.5px; }
.body { border-top: 1px solid var(--line); padding: 8px 10px 10px; }

/* sections */
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸"; display: inline-block; width: 14px; color: var(--muted); transition: transform .1s; }
details[open] > summary::before { transform: rotate(90deg); }
.sec { border: 1px solid var(--line); border-radius: 6px; margin-top: 6px; background: var(--panel); }
.sec > summary { padding: 5px 8px; font-weight: 600; background: var(--panel2); border-radius: 6px; }
.sec[open] > summary { border-bottom: 1px solid var(--line); border-radius: 6px 6px 0 0; }
.sec > summary .sub { font-weight: 400; color: var(--muted); margin-left: 6px; }
.sec.hl { border-color: color-mix(in srgb, var(--you) 45%, var(--line)); }
.sec.hl > summary { background: var(--you-bg); }
.secbody { padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.none { color: var(--muted); font-style: italic; }

/* messages and blocks */
.msg { display: flex; flex-direction: column; gap: 5px; }
.msg + .msg { border-top: 1px dashed var(--line); padding-top: 6px; }
.role { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.blk { border-radius: 6px; padding: 6px 9px; border: 1px solid var(--line); position: relative; min-width: 0; overflow-wrap: anywhere; }
.blk > .lbl { font-size: 12px; font-weight: 700; margin-right: 6px; }
.bh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; padding-right: 48px; }
.blk.you { background: var(--you-bg); border-color: color-mix(in srgb, var(--you) 35%, transparent); }
.blk.you .lbl { color: var(--you); }
.blk.model { background: var(--model-bg); border-color: color-mix(in srgb, var(--model) 25%, transparent); }
.blk.model .lbl { color: var(--model); }
.blk.call { background: var(--call-bg); border-color: var(--call-line); }
.blk.call .lbl { color: var(--call); }
.blk.res { background: var(--res-bg); border-color: var(--res-line); }
.blk.res .lbl { color: var(--res); }
.blk.res.bad, .errbox { background: var(--err-bg); border-color: var(--err-line); }
.blk.res.bad .lbl, .errbox .lbl { color: var(--err); }
.errbox { border: 1px solid var(--err-line); border-radius: 6px; padding: 6px 9px; }
.blk.rem { background: var(--rem-bg); border-style: dashed; color: var(--rem); padding: 3px 9px; }
.blk.rem > summary { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk.think { background: var(--panel2); color: var(--muted); font-style: italic; padding: 3px 9px; }
.blk.ph { background: var(--panel2); color: var(--muted); }
.sum { font-family: var(--mono); font-size: 12.5px; color: var(--text); }
.link { color: var(--you); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: 12.5px; }
.paired { margin-top: 6px; border-radius: 6px; padding: 5px 8px; background: var(--res-bg); border: 1px solid var(--res-line); }
.paired.bad { background: var(--err-bg); border-color: var(--err-line); }
.paired > .lbl { font-size: 12px; font-weight: 700; color: var(--res); }
.paired.bad > .lbl { color: var(--err); }
.copy { position: absolute; top: 4px; right: 6px; font-size: 11px; padding: 0 6px; border: 1px solid var(--line);
  background: var(--panel); border-radius: 4px; cursor: pointer; color: var(--muted); opacity: .75; }
.copy:hover { opacity: 1; color: var(--text); }
.txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.txt.mono { font-family: var(--mono); font-size: 12.5px; }
.more { margin-top: 3px; font-size: 12px; }
.prose p { margin: 4px 0; } .prose ul, .prose ol { margin: 4px 0; padding-left: 22px; }
.prose .mdh { margin: 8px 0 4px; font-size: 14px; }
.prose code { background: color-mix(in srgb, var(--text) 8%, transparent); padding: 0 3px; border-radius: 3px; }
.prose pre.code { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; overflow-x: auto; white-space: pre; }
.prose pre.code code { background: none; padding: 0; }
.prose a { color: var(--you); }
.foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }

/* JSON */
.json { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
.json details > summary { display: block; }
.json .kids { padding-left: 16px; border-left: 1px dotted var(--line); margin-left: 5px; }
.jk { color: var(--jkey); } .js { color: var(--jstr); } .jn { color: var(--jnum); } .jl { color: var(--jlit); }
.jc { color: var(--muted); }
.jstrlong { color: var(--jstr); white-space: pre-wrap; display: block; padding-left: 14px; }

/* tools section */
.toolchips { display: flex; flex-wrap: wrap; gap: 4px; }
.tchip { border: 1px solid var(--line); background: var(--panel2); border-radius: 999px; padding: 0 9px; font-size: 12.5px; cursor: pointer; font-family: var(--mono); }
.tchip.on { border-color: var(--call); color: var(--call); }
.tchip.added { border-color: var(--res); }
.toolpanel { border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.sys .txt { font-size: 13px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 1px 12px; font-family: var(--mono); font-size: 12px; }
.kv .k { color: var(--jkey); }
.kv .v { overflow-wrap: anywhere; }
.evt > summary { font-family: var(--mono); font-size: 12px; }

#newpill { position: fixed; left: 50%; transform: translateX(-50%); top: 0; z-index: 20; display: none;
  background: var(--you); color: #fff; border: 0; border-radius: 999px; padding: 4px 14px; cursor: pointer;
  box-shadow: 0 2px 10px rgba(0,0,0,.25); font-weight: 600; }
.hide { display: none !important; }
</style>
</head>
<body>
<header id="hdr">
  <div class="hrow">
    <h1>Agent Traffic</h1>
    <span class="live" id="live"><span class="dot"></span><span id="livetxt">connecting…</span></span>
    <span class="stat"><b id="nreq">0</b> requests (<span id="nbg">0</span> bg)</span>
    <span class="stat">in <b id="tin">0</b></span>
    <span class="stat">out <b id="tout">0</b></span>
    <span class="stat">cache r <b id="tcr">0</b> w <b id="tcw">0</b></span>
    <button class="errcount stat" id="errbtn" title="Show errors only">errors <b id="nerr">0</b></button>
    <span class="legend">
      <span style="--c: var(--you)">You</span><span style="--c: var(--model)">Model</span>
      <span style="--c: var(--call)">tool call</span><span style="--c: var(--res)">tool result</span>
      <span style="--c: var(--err)">error</span>
    </span>
  </div>
  <div class="hrow"><span class="stat">tools:</span><div class="chips" id="toolchips"><span class="stat">none yet</span></div></div>
  <div class="hrow controls">
    <input type="search" id="q" placeholder="Search prompts, replies, tools…  ( / )">
    <select id="ftool"><option value="">all tools</option></select>
    <select id="fmodel"><option value="">all models</option></select>
    <label><input type="checkbox" id="ferr"> errors only</label>
    <label><input type="checkbox" id="fbg"> hide background</label>
    <span class="stat" id="bghidden"></span>
    <label><input type="checkbox" id="follow" checked> follow live</label>
    <button class="btn" id="theme" title="Theme">theme: auto</button>
  </div>
</header>
<button id="newpill"></button>
<main id="feed"><div class="empty" id="empty">Waiting for traffic… run <code>ANTHROPIC_BASE_URL=http://localhost:8041 claude</code></div></main>

<script>
'use strict';
// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s).replace(/[&<>"']/g, c => ESC[c]);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}
const fmtTok = n => n == null ? '–' : n < 1000 ? String(n) : n < 1e6 ? (n / 1000).toFixed(n < 1e4 ? 1 : 0) + 'k' : (n / 1e6).toFixed(1) + 'M';
const fmtDur = s => s == null ? '' : s < 1 ? Math.round(s * 1000) + 'ms' : s.toFixed(1) + 's';
const fmtTime = ts => new Date(ts * 1000).toLocaleTimeString([], { hour12: false });
const firstLine = (s, n = 140) => { const l = String(s).trim().split('\n')[0]; return l.length > n ? l.slice(0, n) + '…' : l; };
const lineCount = s => s ? String(s).split('\n').length : 0;
const shortModel = m => (m || '').replace(/^claude-/, '');
const hdr = (hs, name) => { if (!hs) return ''; for (const k in hs) if (k.toLowerCase() === name) return hs[k]; return ''; };
const blocks = m => typeof m.content === 'string' ? [{ type: 'text', text: m.content }] : Array.isArray(m.content) ? m.content : [];
function stripCC(v) {
  if (Array.isArray(v)) return v.map(stripCC);
  if (v && typeof v === 'object') { const o = {}; for (const k in v) if (k !== 'cache_control') o[k] = stripCC(v[k]); return o; }
  return v;
}
function hue(s) { let x = 0; for (const c of String(s)) x = (x * 31 + c.charCodeAt(0)) >>> 0; return x % 360; }
const REM = /<system-reminder>[\s\S]*?<\/system-reminder>/g;
function splitReminders(text) {
  const reminders = String(text).match(REM) || [];
  return { prompt: String(text).replace(REM, '').trim(), reminders };
}
function resultText(bl) {
  const c = bl.content;
  if (typeof c === 'string') return c;
  if (Array.isArray(c)) return c.map(x => x.type === 'text' ? x.text : `[${x.type}]`).join('\n');
  return c == null ? '' : JSON.stringify(c);
}
function shortVal(v, n = 80) {
  let s = typeof v === 'string' ? v : JSON.stringify(v);
  if (/^\//.test(s) && s.split('/').length > 3) s = '…/' + s.split('/').slice(-2).join('/');
  return firstLine(s, n);
}
function toolSummary(name, input) {
  if (!input || typeof input !== 'object') return '';
  const pick = k => input[k] != null ? `${k}="${shortVal(input[k])}"` : null;
  let s = null;
  if (/^(Read|Write|Edit|MultiEdit|NotebookEdit)$/.test(name)) s = pick('file_path') || pick('notebook_path');
  else if (name === 'Bash') s = pick('command');
  else if (/^(Grep|Glob)$/.test(name)) s = pick('pattern');
  if (!s) { const k = Object.keys(input)[0]; if (k) s = `${k}=${shortVal(input[k], 60)}`; }
  return s || '';
}
async function copyText(t, btn) {
  try { await navigator.clipboard.writeText(t); }
  catch { const ta = h('textarea'); ta.value = t; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  if (btn) { btn.textContent = 'copied'; setTimeout(() => btn.textContent = 'copy', 900); }
}
const copyBtn = get => { const b = h('button', { class: 'copy', title: 'Copy' }, 'copy'); b.addEventListener('click', e => { e.stopPropagation(); copyText(get(), b); }); return b; };

// ---------- state ----------
const S = {
  ex: new Map(), order: [], seq: 0,
  calls: new Map(),     // tool_use id -> {ex, where, name, input}
  results: new Map(),   // tool_use id -> {ex, block}
  sessions: new Map(),  // session id -> {n: thread counter}
  dirty: new Set(), raf: 0, headerDirty: true,
  f: { tool: '', model: '', errors: false, hideBg: false, q: '' },
  newCount: 0, focus: null,
};
const openState = new Map();     // details key -> open?
const moreState = new Set();     // long-text keys shown in full
const builders = new WeakMap();  // details -> lazy builder

function reset() {
  S.ex.clear(); S.order = []; S.seq = 0; S.calls.clear(); S.results.clear(); S.sessions.clear(); S.dirty.clear();
  S.newCount = 0; S.focus = null;
  $('#feed').innerHTML = ''; $('#feed').append(h('div', { class: 'empty', id: 'empty' }, 'Waiting for traffic…'));
  S.headerDirty = true; schedule();
}
function mark(ex) { if (ex) { S.dirty.add(ex.id); ex._text = null; } S.headerDirty = true; schedule(); }
function schedule() { if (!S.raf) S.raf = requestAnimationFrame(flush); }

// ---------- records ----------
function onRecord(r) {
  if (r.t === 'req') return onReq(r);
  const ex = S.ex.get(r.id);
  if (!ex) return;
  if (r.t === 'resp') {
    ex.status = r.status; ex.resp = r;
    ex.isStream = /event-stream/i.test(hdr(r.headers, 'content-type'));
  } else if (r.t === 'chunk') {
    if (ex.isStream) {
      ex.sse += r.text;
      const parts = ex.sse.split(/\r?\n\r?\n/);
      ex.sse = parts.pop();
      for (const p of parts) if (p.trim()) onSSE(ex, p);
    } else ex.raw += r.text;
  } else if (r.t === 'err') {
    ex.errs.push(r.message || 'error');
  } else if (r.t === 'end') {
    ex.ended = true; ex.t1 = r.ts;
    if (ex.isStream && ex.sse.trim()) { onSSE(ex, ex.sse); ex.sse = ''; }
    if (!ex.isStream && ex.raw) onPlainBody(ex);
  }
  mark(ex);
}

function onReq(r) {
  const b = r.body && typeof r.body === 'object' && !Array.isArray(r.body) ? r.body : null;
  const ex = {
    id: r.id, seq: ++S.seq, req: r, body: b, t0: r.ts, t1: null, status: null, resp: null,
    isStream: false, sse: '', raw: '', events: [], errs: [], streamErr: null, httpErr: null, ended: false,
    reply: { content: [], usage: {}, stop: null, model: null, id: null, stopped: false, unknown: [] },
    model: (b && b.model) || '', sid: hdr(r.headers, 'x-claude-code-session-id') || '',
    msgs: b && Array.isArray(b.messages) ? b.messages : [],

      const buf = []; i++;

      i++; out.push(`<pre class="code"><code>${esc(buf.join('\n'))}</code></pre>`); continue;
    }

  else if (bl._badJson != null) d.append(h('div', { class: 'k-err' }, 'input is not valid JSON:'), h('div', { class: 'txt mono' }, bl._badJson));
  else d.append(lazyDetails(key + 'in', 'json', '<span class="jc">input</span>', true, () => jsonView(bl.input ?? {}, key + 'inj', 2)));

    d.append(h('div', { class: 'paired' + (r.is_error ? ' bad' : '') },

}
function resultCard(bl, key) {

  if (call) head.append(h('span', { class: 'sum' }, toolSummary(call.name, call.input)), exLink(call.ex, bl.tool_use_id, 'call', `↖ call from #${S.ex.get(call.ex).seq}`));
  else head.append(h('span', { class: 'badge bad' }, 'orphan result'));
  if (bl.is_error) head.append(h('span', { class: 'badge bad' }, 'is_error'));
  const d = h('div', { class: 'blk res' + (bl.is_error ? ' bad' : ''), 'data-result': bl.tool_use_id }, head, resultBody(bl, key));
  d.append(copyBtn(() => resultText(bl)));
  return d;
}
function renderMsg(m, ex, key) {

  blocks(m).forEach((bl, i) => d.append(renderBlock(bl, m.role, ex, key + '.' + i)));
  return d;
}

// ---------- sections ----------
function secTitle(ex, name) {
  const b = ex.body || {};
  switch (name) {
    case 'new': return `New in this request <span class="sub">${ex.newMsgs.length} message${ex.newMsgs.length === 1 ? '' : 's'}${ex.newThread ? ' · new thread' : ''}</span>`;
    case 'reply': {
      const st = errorReason(ex) ? 'error' : !ex.ended ? 'streaming…' : ex.reply.stop || (ex.status ? 'HTTP ' + ex.status : '');
      return `Reply <span class="sub">${esc(st)}</span>`;
    }
    case 'conv': return `Conversation so far <span class="sub">${ex.newFrom} earlier message${ex.newFrom === 1 ? '' : 's'}</span>`;
    case 'sys': {
      const chars = sysText(b.system).reduce((n, t) => n + t.length, 0);
      const ch = ex.sysSame == null ? (ex.main ? 'first request of this thread' : '') : ex.sysSame ? `unchanged since #${ex.sysSince}` : 'changed';
      return `System instructions <span class="sub">${chars.toLocaleString()} chars${ch ? ' · ' + ch : ''}</span>`;
    }
    case 'tools': {
      const n = (b.tools || []).length;
      let ch = '';
      if (ex.toolsSame === true) ch = `unchanged since #${ex.toolsSince}`;
      else if (ex.toolsSame === false) ch = (ex.toolsAdded.length || ex.toolsRemoved.length) ? `+${ex.toolsAdded.length} −${ex.toolsRemoved.length}` : 'definitions changed';
      return `Tools (${n}) <span class="sub">${ch}</span>`;
    }
    case 'raw': return `Raw <span class="sub">headers, body, ${ex.isStream ? ex.events.length + ' SSE events' : 'reply body'}</span>`;
  }
}
const sysText = s => s == null ? [] : typeof s === 'string' ? [s] : Array.isArray(s) ? s.map(x => typeof x === 'string' ? x : x.text != null ? x.text : JSON.stringify(x)) : [JSON.stringify(s)];
function sectionsFor(ex) {
  const b = ex.body || {};
  const all = ['new', 'reply', 'conv', 'sys', 'tools', 'raw'];
  if (ex.main) return all;
  return all.filter(n => n === 'raw' || n === 'reply' || (n === 'new' && ex.msgs.length) || (n === 'sys' && b.system != null) || (n === 'tools' && (b.tools || []).length));
}
const DYNAMIC = new Set(['new', 'reply', 'raw', 'conv']);
function buildSection(ex, name) {
  const body = h('div', { class: 'secbody' + (name === 'sys' ? ' sys' : '') });
  const k = ex.id + ':' + name;
  const b = ex.body || {};
  if (name === 'new') {
    if (!ex.newMsgs.length) body.append(h('div', { class: 'none' }, 'No new messages.'));
    ex.newMsgs.forEach((m, i) => body.append(renderMsg(m, ex, k + i)));
  } else if (name === 'reply') {
    const err = errorReason(ex);
    if (err) {
      const box = h('div', { class: 'errbox' }, h('div', { class: 'lbl' }, 'Error'), h('div', { class: 'txt mono' }, err));
      if (ex.plain && ex.plain.error) box.append(jsonView(ex.plain, k + 'e', 2));
      if (ex.streamErr) box.append(jsonView(ex.streamErr, k + 'se', 2));
      body.append(box);
    }
    const R = ex.reply;
    R.content.forEach((bl, i) => body.append(renderBlock(bl, bl && bl.type === 'text' ? 'assistant' : 'reply', ex, k + i)));
    if (!R.content.length && !err) body.append(h('div', { class: 'none' }, ex.ended ? (ex.raw ? '' : 'No message body.') : 'waiting for the reply…'));
    if (!R.content.length && ex.raw && !ex.plain) body.append(longText(ex.raw, k + 'raw', { mono: true }));
    if (R.unknown.length) body.append(lazyDetails(k + 'unk', 'blk ph', `unknown events (${R.unknown.length})`, false, () => jsonView(R.unknown, k + 'unkj', 1)));
    const u = R.usage || {};
    const foot = h('div', { class: 'foot' });
    if (!ex.ended) foot.append(h('span', { class: 'spin' }), 'streaming');
    if (R.stop) foot.append(h('span', { class: 'badge ' + (R.stop === 'max_tokens' ? 'warn' : R.stop === 'tool_use' ? 'call' : '') }, R.stop));
    if (u.input_tokens != null) foot.append(`input ${u.input_tokens} · cache read ${u.cache_read_input_tokens || 0} · cache write ${u.cache_creation_input_tokens || 0} · output ${u.output_tokens ?? '–'}`);
    if (ex.t1) foot.append(' · ' + fmtDur(ex.t1 - ex.t0));
    if (R.model) foot.append(' · ' + R.model);
    if (R.id) foot.append(h('span', { class: 'mono' }, ' · ' + R.id));
    body.append(foot);
  } else if (name === 'conv') {
    const earlier = ex.msgs.slice(0, ex.newFrom);
    if (!earlier.length) body.append(h('div', { class: 'none' }, 'Nothing earlier: this request starts its thread.'));
    const all = moreState.has(k);
    const from = all ? 0 : Math.max(0, earlier.length - 6);
    if (from > 0) {
      const btn = h('span', { class: 'link' }, `show all ${earlier.length} messages (${from} hidden)`);
      btn.addEventListener('click', () => { moreState.add(k); rebuild(ex, 'conv'); });
      body.append(btn);
    }
    earlier.slice(from).forEach((m, i) => body.append(renderMsg(m, ex, k + (from + i))));
  } else if (name === 'sys') {
    const texts = sysText(b.system);
    if (!texts.length) body.append(h('div', { class: 'none' }, 'No system instructions.'));
    texts.forEach((t, i) => {
      const d = h('div', { class: 'blk' }, h('div', { class: 'role' }, `system block ${i + 1} of ${texts.length} · ${t.length.toLocaleString()} chars`), longText(t, k + i, { full: true }));
      d.append(copyBtn(() => t)); body.append(d);
    });
  } else if (name === 'tools') {
    const tools = b.tools || [];
    const panel = h('div', { class: 'toolpanel hide' });
    const chips = h('div', { class: 'toolchips' });
    let current = null;
    tools.forEach((t, i) => {
      const c = h('button', { class: 'tchip' + (ex.toolsAdded && ex.toolsAdded.includes(t.name) ? ' added' : ''), title: ex.toolsAdded && ex.toolsAdded.includes(t.name) ? 'added since the previous request' : '' }, t.name);
      c.addEventListener('click', () => {
        chips.querySelectorAll('.tchip').forEach(x => x.classList.remove('on'));
        if (current === i) { current = null; panel.classList.add('hide'); return; }
        current = i; c.classList.add('on'); panel.classList.remove('hide'); panel.innerHTML = '';
        panel.append(h('div', null, h('b', { class: 'mono' }, t.name)));
        if (t.description) panel.append(longText(t.description, k + 'd' + i));
        panel.append(h('div', { class: 'role' }, 'input schema'), jsonView(t.input_schema || t, k + 's' + i, 3));
        const rest = Object.fromEntries(Object.entries(t).filter(([x]) => !['name', 'description', 'input_schema'].includes(x)));
        if (Object.keys(rest).length) panel.append(h('div', { class: 'role' }, 'other fields'), jsonView(rest, k + 'o' + i, 1));
        applyHighlight(panel);
      });
      chips.append(c);
    });
    if (ex.toolsRemoved && ex.toolsRemoved.length) chips.append(h('span', { class: 'k-muted' }, ' removed: ' + ex.toolsRemoved.join(', ')));
    body.append(chips, panel);
  } else if (name === 'raw') {
    const r = ex.req;
    body.append(h('div', { class: 'role' }, `request · ${r.method} ${r.path}`), kv(r.headers));
    if (ex.body) body.append(lazyDetails(k + 'body', 'json', '<span class="jc">request body</span>', false, () => jsonView(ex.body, k + 'bj', 1)));
    else if (r.body_text) body.append(longText(r.body_text, k + 'bt', { mono: true }));
    if (ex.resp) body.append(h('div', { class: 'role' }, `reply · ${ex.resp.status} ${ex.resp.reason || ''}`), kv(ex.resp.headers));
    if (ex.isStream) {
      const list = h('div');
      ex.events.forEach((e, i) => {
        const t = e.data && typeof e.data === 'object' ? (e.data.type || e.event) + (e.data.delta && e.data.delta.type ? ' · ' + e.data.delta.type : '') : e.event;
        list.append(lazyDetails(k + 'ev' + i, 'evt', esc(`${i + 1}. ${t}`), false, () => typeof e.data === 'object' ? jsonView(e.data, k + 'evj' + i, 3) : h('div', { class: 'txt mono' }, String(e.data))));
      });
      body.append(lazyDetails(k + 'events', 'json', `<span class="jc">reply SSE events (${ex.events.length})</span>`, false, () => list));
    } else if (ex.plain) body.append(lazyDetails(k + 'plain', 'json', '<span class="jc">reply body</span>', true, () => jsonView(ex.plain, k + 'pj', 2)));
    else if (ex.raw) body.append(longText(ex.raw, k + 'rawt', { mono: true }));
    if (ex.errs.length) body.append(h('div', { class: 'errbox' }, h('div', { class: 'lbl' }, 'proxy errors'), h('div', { class: 'txt mono' }, ex.errs.join('\n'))));
    const cp = h('div', { class: 'foot' });
    const b1 = h('button', { class: 'btn' }, 'copy request JSON'); b1.addEventListener('click', () => copyText(JSON.stringify(ex.body ?? r.body_text ?? null, null, 2), null));
    const b2 = h('button', { class: 'btn' }, 'copy reply'); b2.addEventListener('click', () => copyText(ex.isStream ? ex.events.map(e => JSON.stringify(e.data)).join('\n') : ex.raw, null));
    cp.append(b1, b2); body.append(cp);
  }
  return body;
}
function kv(obj) {
  const g = h('div', { class: 'kv' });
  for (const [k, v] of Object.entries(obj || {})) g.append(h('span', { class: 'k' }, k), h('span', { class: 'v' }, String(v)));
  return g;
}
function buildBody(ex) {
  const body = h('div', { class: 'body' });
  ex.secs = {};
  for (const name of sectionsFor(ex)) {
    const def = name === 'new' || name === 'reply';
    const d = lazyDetails(ex.id + ':' + name, 'sec' + (name === 'new' ? ' hl' : ''), secTitle(ex, name), def, () => buildSection(ex, name));
    ex.secs[name] = d; body.append(d);
  }
  return body;
}
function rebuild(ex, name) {
  const d = ex.secs && ex.secs[name];
  if (!d || !d._built) return;
  const old = d.querySelector(':scope > .secbody');
  const fresh = buildSection(ex, name);
  old ? old.replaceWith(fresh) : d.append(fresh);
  applyHighlight(fresh);
}

// ---------- rows ----------
function ensureRow(ex) {
  if (ex.row) return false;
  const head = h('div', { class: 'head', tabindex: '0' });
  const row = h('div', { class: 'row' + (ex.main ? '' : ' bg'), 'data-id': ex.id }, head);
  head.addEventListener('click', e => { if (e.target.closest('.link, .copy, button')) return; toggleRow(ex); });
  ex.row = row; ex.head = head;
  const feed = $('#feed'); const empty = $('#empty');
  if (empty) empty.remove();
  feed.prepend(row);
  return true;
}
function toggleRow(ex, force) {
  if (!ex.row) updateRow(ex);  // not drawn yet (the tab was in the background)
  ex.expanded = force ?? !ex.expanded;
  if (ex.expanded && !ex.bodyEl) { ex.bodyEl = buildBody(ex); ex.row.append(ex.bodyEl); applyHighlight(ex.bodyEl); }
  if (ex.bodyEl) ex.bodyEl.classList.toggle('hide', !ex.expanded);
  S.focus = ex; markFocus();
}
function updateRow(ex) {
  const isNew = ensureRow(ex);
  ex.head.innerHTML = rowHead(ex);
  ex.row.classList.toggle('err', !!errorReason(ex));
  ex.row.classList.toggle('hide', !visible(ex) && !ex.forced);
  if (ex.bodyEl) {
    for (const [name, d] of Object.entries(ex.secs)) {
      d.querySelector(':scope > summary').innerHTML = secTitle(ex, name);
      if (DYNAMIC.has(name) && d._built && d.open) rebuild(ex, name);
      else if (DYNAMIC.has(name) && d._built) { d._built = false; d.querySelector(':scope > .secbody')?.remove(); }
    }
  }
  return isNew;
}

// ---------- flush: render dirty rows, keep the reader's place ----------
function anchorRow() {
  const top = $('#hdr').getBoundingClientRect().bottom;
  for (const row of $('#feed').children) {
    if (row.classList.contains('hide') || !row.classList.contains('row')) continue;
    const r = row.getBoundingClientRect();
    if (r.bottom > top) {
      // Inside a tall open row, anchor on the element at the top of the screen instead.
      const el = document.elementFromPoint(Math.min(window.innerWidth - 20, row.getBoundingClientRect().left + 40), top + 4);
      const target = el && row.contains(el) ? el : row;
      return { el: target, top: target.getBoundingClientRect().top };
    }
  }
  return null;
}
function flush() {
  S.raf = 0;
  const atTop = window.scrollY < 40;
  const stick = $('#follow').checked && atTop;
  const anchor = stick ? null : anchorRow();
  let added = 0;
  for (const id of S.dirty) { const ex = S.ex.get(id); if (ex && updateRow(ex) && visible(ex)) added++; }
  S.dirty.clear();
  if (S.headerDirty) renderHeader();
  if (anchor && anchor.el.isConnected) {
    const d = anchor.el.getBoundingClientRect().top - anchor.top;
    if (Math.abs(d) > 0.5) window.scrollBy(0, d);
  }
  if (!stick && added) { S.newCount += added; }
  updatePill();
}
function updatePill() {
  const p = $('#newpill');
  if (window.scrollY < 40) S.newCount = 0;
  p.style.display = S.newCount ? 'block' : 'none';
  p.style.top = ($('#hdr').getBoundingClientRect().bottom + 6) + 'px';
  p.textContent = `${S.newCount} new ↑`;
}
window.addEventListener('scroll', () => { if (window.scrollY < 40 && S.newCount) updatePill(); }, { passive: true });
$('#newpill').addEventListener('click', () => { S.newCount = 0; window.scrollTo({ top: 0 }); updatePill(); });

// ---------- header ----------
let lastToolKey = '', lastModelKey = '';
function renderHeader() {
  S.headerDirty = false;
  let n = 0, bg = 0, tin = 0, tout = 0, tcr = 0, tcw = 0, nerr = 0, bgHidden = 0;
  const models = new Set();
  for (const ex of S.ex.values()) {
    n++; if (!ex.main) { bg++; if (S.f.hideBg) bgHidden++; }
    const u = usage(ex);
    // "in" counts all input tokens, cached or not, the same way each row does.
    tin += (u.input_tokens || 0) + (u.cache_read_input_tokens || 0) + (u.cache_creation_input_tokens || 0);
    tout += u.output_tokens || 0; tcr += u.cache_read_input_tokens || 0; tcw += u.cache_creation_input_tokens || 0;
    if (errorReason(ex)) nerr++;
    const m = ex.model || ex.reply.model; if (m) models.add(m);
  }
  $('#nreq').textContent = n; $('#nbg').textContent = bg;
  $('#tin').textContent = fmtTok(tin); $('#tout').textContent = fmtTok(tout);
  $('#tcr').textContent = fmtTok(tcr); $('#tcw').textContent = fmtTok(tcw);
  $('#nerr').textContent = nerr; $('#errbtn').classList.toggle('has', nerr > 0);
  $('#bghidden').textContent = bgHidden ? `${bgHidden} background hidden` : '';
  const counts = new Map();
  for (const c of S.calls.values()) counts.set(c.name, (counts.get(c.name) || 0) + 1);
  const sorted = [...counts].sort((a, b) => b[1] - a[1]);
  const key = JSON.stringify(sorted) + S.f.tool;
  if (key !== lastToolKey) {
    lastToolKey = key;
    const box = $('#toolchips'); box.innerHTML = '';
    if (!sorted.length) box.append(h('span', { class: 'stat' }, 'none yet'));
    for (const [name, c] of sorted) {
      const chip = h('button', { class: 'chip' + (S.f.tool === name ? ' on' : ''), title: 'Filter by this tool' }, `${name} ${c}`);
      chip.addEventListener('click', () => setFilter('tool', S.f.tool === name ? '' : name));
      box.append(chip);
    }
    syncSelect($('#ftool'), sorted.map(x => x[0]), 'all tools', S.f.tool);
  }
  const mkey = [...models].sort().join(',') + S.f.model;
  if (mkey !== lastModelKey) { lastModelKey = mkey; syncSelect($('#fmodel'), [...models].sort(), 'all models', S.f.model); }
}
function syncSelect(sel, values, allLabel, current) {
  sel.innerHTML = '';
  sel.append(h('option', { value: '' }, allLabel));
  for (const v of values) sel.append(h('option', { value: v }, v));
  sel.value = values.includes(current) ? current : '';
}

// ---------- filters ----------
function setFilter(k, v) {
  S.f[k] = v;
  if (k === 'tool') $('#ftool').value = v;
  if (k === 'errors') $('#ferr').checked = v;
  for (const ex of S.ex.values()) { ex.forced = false; if (ex.row) ex.row.classList.toggle('hide', !visible(ex)); }
  if (k === 'q') for (const ex of S.ex.values()) if (ex.bodyEl && ex.expanded) applyHighlight(ex.bodyEl);
  S.headerDirty = true; schedule();
}
$('#ftool').addEventListener('change', e => setFilter('tool', e.target.value));
$('#fmodel').addEventListener('change', e => setFilter('model', e.target.value));
$('#ferr').addEventListener('change', e => setFilter('errors', e.target.checked));
$('#fbg').addEventListener('change', e => setFilter('hideBg', e.target.checked));
$('#errbtn').addEventListener('click', () => setFilter('errors', !S.f.errors));
let qTimer = 0;
$('#q').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => setFilter('q', e.target.value.trim().toLowerCase()), 150); });

function applyHighlight(root) {
  if (!root) return;
  root.querySelectorAll('mark.hit').forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
  root.normalize();
  const q = S.f.q;
  if (!q) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) { const n = walker.currentNode; if (n.nodeValue.toLowerCase().includes(q) && !n.parentElement.closest('summary.no-hl')) nodes.push(n); }
  for (const n of nodes) {
    const text = n.nodeValue, low = text.toLowerCase(), frag = document.createDocumentFragment();
    let i = 0, j;
    while ((j = low.indexOf(q, i)) !== -1) { frag.append(text.slice(i, j), h('mark', { class: 'hit' }, text.slice(j, j + q.length))); i = j + q.length; }
    frag.append(text.slice(i)); n.replaceWith(frag);
  }
}

// ---------- jump between a call and its result ----------
function jump(toolId, to) {
  const reg = to === 'result' ? S.results.get(toolId) : S.calls.get(toolId);
  if (!reg) return;
  const ex = S.ex.get(reg.ex);
  if (ex.row.classList.contains('hide')) { ex.forced = true; ex.row.classList.remove('hide'); }
  toggleRow(ex, true);
  const secName = to === 'result' ? 'new' : reg.where === 'reply' ? 'reply' : 'new';
  const sec = ex.secs[secName];
  sec._build(); sec.open = true; openState.set(sec.dataset.k, true);
  const target = ex.row.querySelector(`[data-${to}="${CSS.escape(toolId)}"]`) || ex.row;
  target.scrollIntoView({ block: 'center', behavior: 'smooth' });
  target.classList.remove('flash'); void target.offsetWidth; target.classList.add('flash');
}

// ---------- keyboard ----------
function visibleRows() { return [...$('#feed').children].filter(r => r.classList.contains('row') && !r.classList.contains('hide')); }
function markFocus() {
  document.querySelectorAll('.row.focus').forEach(r => r.classList.remove('focus'));
  if (S.focus && S.focus.row) S.focus.row.classList.add('focus');
}
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); $('#q').focus(); return; }
  if (e.key === 'Escape' && document.activeElement === $('#q')) { $('#q').value = ''; setFilter('q', ''); $('#q').blur(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'j' || e.key === 'k') {
    const rows = visibleRows(); if (!rows.length) return;
    let i = S.focus && S.focus.row ? rows.indexOf(S.focus.row) : -1;
    i = e.key === 'j' ? Math.min(rows.length - 1, i + 1) : Math.max(0, i - 1);
    S.focus = S.ex.get(rows[i].dataset.id); markFocus();
    rows[i].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter' && S.focus) { toggleRow(S.focus); }
});

// ---------- theme ----------
const THEMES = ['auto', 'light', 'dark'];
function setTheme(t) {
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t;
  $('#theme').textContent = 'theme: ' + t;
  try { localStorage.setItem('theme', t); } catch { /* private mode */ }
}
let theme = 'auto';
try { theme = localStorage.getItem('theme') || 'auto'; } catch { /* ignore */ }
setTheme(THEMES.includes(theme) ? theme : 'auto');
$('#theme').addEventListener('click', () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; setTheme(theme); });

// ---------- live connection ----------
function connect() {
  const es = new EventSource('/events');
  const live = $('#live'), txt = $('#livetxt');
  es.onopen = () => { live.className = 'live on'; txt.textContent = 'live'; };
  es.onerror = () => { live.className = 'live wait'; txt.textContent = 'reconnecting…'; };
  es.onmessage = e => { let r; try { r = JSON.parse(e.data); } catch { return; } try { onRecord(r); } catch (err) { console.error('bad record', r, err); } };
  es.addEventListener('reset', () => reset());
}
connect();
