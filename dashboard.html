<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Traffic</title>
<style>
:root {
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1f2328; --muted:#6b7280; --faint:#9ca3af; --line:#e3e5e8;
  --you:#1d4ed8; --you-bg:#eaf1ff; --you-bd:#b9cdf8;
  --pend:#c2410c; --pend-bg:#fff1e6; --pend-bd:#f7c59f;
  --model:#374151; --model-bg:#f3f4f6; --model-bd:#d4d4d8;
  --call:#a15c00; --call-bg:#fff7e6; --call-bd:#efcf86;
  --res:#157a3a; --res-bg:#ecfaf0; --res-bd:#9fdcb3;
  --err:#d42020; --err-bg:#fff0f0; --err-bd:#f1a9a9;
  --warn:#a35b00; --warn-bg:#fff4d6;
  --sys-bg:#f0f0f3; --sys-bd:#cfd2d8;
  --mark:#ffe46b; --flash:#ffd54a;
  --perm:#c2410c; --perm-bg:#fff1e6; --perm-bd:#f7b98a;
  --j-key:#7c3aed; --j-str:#0f7a3a; --j-num:#b45309; --j-lit:#2563eb;
  --shadow:0 1px 2px rgba(0,0,0,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0e1014; --panel:#161920; --ink:#e4e6ea; --muted:#9aa1ad; --faint:#6b7280; --line:#2a2f39;
    --you:#8db4ff; --you-bg:#14213a; --you-bd:#2a4677;
    --pend:#fb923c; --pend-bg:#2d1c10; --pend-bd:#6b4220;
    --model:#d1d5db; --model-bg:#1c2028; --model-bd:#363c48;
    --call:#f0be5c; --call-bg:#271f10; --call-bd:#5a4720;
    --res:#6fd98e; --res-bg:#11261a; --res-bd:#275b37;
    --err:#ff6b6b; --err-bg:#2b1414; --err-bd:#6b2b2b;
    --warn:#f0b44c; --warn-bg:#2d2410;
    --sys-bg:#1b1e25; --sys-bd:#3a404c;
    --mark:#8a6d00; --flash:#7a5c00;
    --perm:#fb923c; --perm-bg:#2c1a0c; --perm-bd:#7a3e12;
    --j-key:#c4a5ff; --j-str:#7fd99b; --j-num:#f5b86b; --j-lit:#8db4ff;
    --shadow:none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0e1014; --panel:#161920; --ink:#e4e6ea; --muted:#9aa1ad; --faint:#6b7280; --line:#2a2f39;
  --you:#8db4ff; --you-bg:#14213a; --you-bd:#2a4677;
  --pend:#fb923c; --pend-bg:#2d1c10; --pend-bd:#6b4220;
  --model:#d1d5db; --model-bg:#1c2028; --model-bd:#363c48;
  --call:#f0be5c; --call-bg:#271f10; --call-bd:#5a4720;
  --res:#6fd98e; --res-bg:#11261a; --res-bd:#275b37;
  --err:#ff6b6b; --err-bg:#2b1414; --err-bd:#6b2b2b;
  --warn:#f0b44c; --warn-bg:#2d2410;
  --sys-bg:#1b1e25; --sys-bd:#3a404c;
  --mark:#8a6d00; --flash:#7a5c00;
  --perm:#fb923c; --perm-bg:#2c1a0c; --perm-bd:#7a3e12;
  --j-key:#c4a5ff; --j-str:#7fd99b; --j-num:#f5b86b; --j-lit:#8db4ff;
  --shadow:none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { overflow-anchor: none; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow-x:hidden; overflow-wrap:anywhere; }
.mono, pre, code, .json { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12.5px; }
pre { margin:0; white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere; }
button { font:inherit; color:inherit; }
a { color:var(--you); }
mark { background:var(--mark); color:inherit; border-radius:2px; }

/* header */
header { position:sticky; top:0; z-index:20; background:var(--panel); border-bottom:1px solid var(--line); padding:8px 16px; display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow); }
.hrow { display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; }
.live { font-weight:600; color:var(--res); }
.live.off { color:var(--muted); }
.stat b { font-weight:600; }
.stat { color:var(--muted); }
.stat b { color:var(--ink); }
.hcount { cursor:pointer; border-radius:10px; padding:1px 8px; border:1px solid var(--line); }
.hcount.red { color:var(--err); border-color:var(--err-bd); background:var(--err-bg); }
.hcount.zero { color:var(--muted); background:none; border-color:var(--line); }
.hcount.warnc { color:var(--warn); border-color:var(--warn); background:var(--warn-bg); }
.hcount.on { outline:2px solid currentColor; }
.hcount.gray { color:var(--muted); }
.toolchips { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
.tchip { cursor:pointer; border:1px solid var(--call-bd); background:var(--call-bg); color:var(--call); border-radius:10px; padding:0 7px; font-size:12px; }
.tchip.on { outline:2px solid var(--call); }
input[type=search], select { background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:3px 7px; font:inherit; }
input[type=search] { width:220px; }
.tbtn { cursor:pointer; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:2px 9px; }
.tbtn.on { background:var(--you-bg); border-color:var(--you-bd); color:var(--you); }
.spacer { flex:1; }
.legend-key { display:inline-flex; gap:8px; flex-wrap:wrap; }
.kdot { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:3px; vertical-align:-1px; border:1px solid; }
.kdot.you { background:var(--you-bg); border-color:var(--you); }
.kdot.pend { background:var(--pend-bg); border-color:var(--pend); }
.kdot.auto { background:var(--bg); border-color:var(--muted); }
.kdot.model { background:var(--model-bg); border-color:var(--model-bd); }
.kdot.call { background:var(--call-bg); border-color:var(--call); }
.kdot.res { background:var(--res-bg); border-color:var(--res); }

/* legend */
#legend { position:fixed; right:16px; top:70px; z-index:40; width:min(560px, calc(100vw - 32px)); max-height:calc(100vh - 90px); overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 16px; box-shadow:0 8px 30px rgba(0,0,0,.25); }
#legend h3 { margin:6px 0 6px; font-size:14px; }
#legend dl { margin:0; display:grid; grid-template-columns:max-content 1fr; gap:4px 12px; }
#legend dt { white-space:nowrap; }
#legend dd { margin:0; color:var(--muted); }

/* feed */
#feed { padding:8px 16px 80px; display:flex; flex-direction:column; gap:6px; }
.row { background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:8px; }
.row.main { border-left-color:var(--you-bd); }
.row.bg { opacity:.78; font-size:13px; }
.row.bg .rh, .row.bg .pv { padding-top:2px; padding-bottom:2px; }
.row.err { border-left-color:var(--err); }
.row.sel { outline:2px solid var(--you-bd); }
.row.flashrow { animation: flash 1.2s ease-out; }
.rh, .pv { cursor:pointer; padding:4px 10px; }
.rh { display:flex; flex-wrap:wrap; align-items:center; gap:4px 9px; }
.rh .time { color:var(--muted); font-variant-numeric:tabular-nums; }
.rh .seq { font-weight:600; }
.pv { padding-top:0; display:flex; gap:6px; white-space:nowrap; overflow:hidden; }
.pv .arrow { color:var(--faint); flex:none; width:14px; }
.pv .pvtext { overflow:hidden; text-overflow:ellipsis; min-width:0; }
.pv .pvtext { display:flex; gap:0 10px; align-items:baseline; }
.pv .pvtext > * { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pv .pvtext > .spin { flex:none; }
.pv .pvtext .c-you, .pv .pvtext .c-model, .pv .pvtext .c-pend, .pv .pvtext .c-auto { display:flex; gap:5px; }
.pvl { flex:none; }
.pvq { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.c-you { color:var(--you); font-weight:500; }
.c-pend { color:var(--pend); font-weight:500; }
.c-auto { color:var(--muted); }
.c-model { color:var(--model); }
.c-call { color:var(--call); font-family:ui-monospace, Menlo, monospace; font-size:12.5px; }
.c-res { color:var(--res); }
.c-res.e { color:var(--err); }
.c-muted { color:var(--muted); }
.c-err { color:var(--err); font-weight:600; }
.badge { display:inline-block; font-size:11.5px; line-height:17px; padding:0 6px; border-radius:9px; border:1px solid var(--line); color:var(--muted); background:var(--bg); white-space:nowrap; }
.badge.thread { color:var(--you); border-color:var(--you-bd); background:var(--you-bg); font-weight:600; }
.badge.red { color:#fff; background:var(--err); border-color:var(--err); }
.badge.redo { color:var(--err); border-color:var(--err-bd); background:var(--err-bg); }
.badge.warn { color:var(--warn); background:var(--warn-bg); border-color:var(--warn); }
.badge.call { color:var(--call); background:var(--call-bg); border-color:var(--call-bd); }
.badge.res { color:var(--res); background:var(--res-bg); border-color:var(--res-bd); }
.badge.mark { color:var(--ink); }
.badge.new { color:var(--you); border-style:dashed; }
.badge.pend { color:var(--pend); background:var(--pend-bg); border-color:var(--pend-bd); }
.badge.auto { color:var(--muted); border-style:dashed; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--err); display:inline-block; }
.tok { color:var(--muted); font-variant-numeric:tabular-nums; font-size:12.5px; }
.tok b { color:var(--ink); font-weight:500; }
.spin { display:inline-block; width:11px; height:11px; border:2px solid var(--line); border-top-color:var(--you); border-radius:50%; animation:spin .8s linear infinite; vertical-align:-1px; }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes flash { 0% { background:var(--flash); } 100% { background:transparent; } }
.flash { animation: flash 1.4s ease-out; }

/* expanded body */
.body { display:none; border-top:1px solid var(--line); padding:6px 10px 10px; }
.row.open .body { display:block; }
.row.open .pv { white-space:normal; }
.sec { margin-top:6px; }
.sec-h { cursor:pointer; display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; padding:3px 4px; border-radius:5px; font-weight:600; user-select:none; }
.sec-h:hover { background:var(--bg); }
.sec-h .caret { width:12px; color:var(--muted); }
.sec-h .caret::before { content:"▸"; }
.sec.open > .sec-h .caret::before { content:"▾"; }
.sec-h .sum { font-weight:400; color:var(--muted); font-size:13px; }
.sec-b { display:none; padding:4px 0 2px 16px; }
.sec.open > .sec-b { display:block; }
.sec.newsec > .sec-b { border-left:3px solid var(--you-bd); margin-left:4px; padding-left:12px; background:linear-gradient(90deg, var(--you-bg), transparent 60%); border-radius:4px; }
.msgcap { font-size:11.5px; color:var(--faint); margin:8px 0 2px; }
.blk { border:1px solid var(--line); border-radius:8px; padding:6px 10px; margin:4px 0; position:relative; background:var(--panel); }
.blk-h { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; font-size:12.5px; margin-bottom:3px; padding-right:48px; }
.lbl { font-weight:700; font-size:11.5px; text-transform:none; letter-spacing:.2px; }
.copy { position:absolute; top:4px; right:6px; font-size:11px; padding:0 6px; border:1px solid var(--line); border-radius:5px; background:var(--panel); cursor:pointer; color:var(--muted); }
.copy:hover { color:var(--ink); }
.blk.you { background:var(--you-bg); border-color:var(--you-bd); }
.blk.you .lbl { color:var(--you); }
.blk.pend { background:var(--pend-bg); border-color:var(--pend-bd); }
.blk.pend .lbl { color:var(--pend); }
.blk.model { background:var(--model-bg); border-color:var(--model-bd); }
.blk.model .lbl { color:var(--model); }
.blk.call { background:var(--call-bg); border-color:var(--call-bd); }
.blk.call > .blk-h .lbl, .blk.call > .blk-h .tname { color:var(--call); }
.blk.result { background:var(--res-bg); border-color:var(--res-bd); }
.blk.result > .blk-h .lbl, .blk.result > .blk-h .tname { color:var(--res); }
.blk.result.e, .inres.e { background:var(--err-bg); border-color:var(--err-bd); }
.blk.result.e > .blk-h .lbl, .blk.result.e > .blk-h .tname { color:var(--err); }
.blk.reminder { background:transparent; border:1px dashed var(--sys-bd); color:var(--muted); padding:3px 10px; }
.blk.reminder .lbl, .blk.sysmsg .lbl, .blk.bgtext .lbl, .blk.thinking .lbl { color:var(--muted); }
.blk.sysmsg { background:var(--sys-bg); border-color:var(--sys-bd); }
.blk.bgtext { background:var(--sys-bg); border-color:var(--sys-bd); }
.blk.thinking { background:transparent; border-style:dotted; color:var(--muted); font-style:italic; }
.blk.raw, .blk.media { background:var(--sys-bg); }
.oneline { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; color:var(--muted); }
.tname { font-weight:700; font-family:ui-monospace, Menlo, monospace; }
.tsum { font-family:ui-monospace, Menlo, monospace; color:var(--ink); }
.link { cursor:pointer; color:var(--you); text-decoration:underline; text-decoration-style:dotted; }
.inres { border:1px solid var(--res-bd); background:var(--res-bg); border-radius:6px; padding:4px 8px; margin-top:6px; }
.more { cursor:pointer; border:none; background:none; color:var(--you); padding:2px 0; font-size:12.5px; text-decoration:underline; }
.warnline { color:var(--warn); font-size:12.5px; }
.prose p, .prose .para { margin:4px 0; }
.prose ul, .prose ol { margin:4px 0; padding-left:22px; }
.prose pre.code { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; margin:4px 0; }
.prose code { background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:0 3px; }
.mdh { font-weight:700; margin:6px 0 2px; }
.mdh1 { font-size:1.2em; } .mdh2 { font-size:1.1em; }
.chips { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0; }
.chip { cursor:pointer; font-family:ui-monospace, Menlo, monospace; font-size:12px; border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:0 8px; }
.chip.on { border-color:var(--call); color:var(--call); }
.chip.add { border-color:var(--call-bd); color:var(--call); background:var(--call-bg); }
.kv { display:grid; grid-template-columns:max-content 1fr; gap:2px 10px; font-size:12.5px; }
.kv .k { color:var(--muted); }

/* json */
.json { line-height:1.4; }
.j-k { color:var(--j-key); }
.j-s { color:var(--j-str); white-space:pre-wrap; word-break:break-word; }
.j-n { color:var(--j-num); }
.j-l { color:var(--j-lit); }
.j-t { cursor:pointer; color:var(--muted); display:inline-block; width:12px; user-select:none; }
.j-kids { padding-left:16px; }
.j-sum { color:var(--muted); cursor:pointer; }

/* v3: sessions, subagents, permission, injection, system sections */
.row.sess { box-shadow: inset 6px 0 0 var(--sess); }
.row.sess .rh, .row.sess .pv { padding-left:16px; }
.row.sub { margin-left:24px; }
.badge.sub { color:var(--call); border-color:var(--call-bd); }
.badge.inj { color:#fff; background:#b45309; border-color:#b45309; }
.badge.perm { color:var(--perm); border-color:var(--perm-bd); background:var(--perm-bg); }
.dot.perm { background:var(--perm); }
.blk.result.perm, .inres.perm { background:var(--perm-bg); border-color:var(--perm-bd); }
.blk.result.perm > .blk-h .lbl, .blk.result.perm > .blk-h .tname, .inres.perm .lbl { color:var(--perm); }
mark.inj { background:#f59e0b; color:#000; font-weight:600; }
.c-perm { color:var(--perm); }
.blk.notif { background:var(--sys-bg); border-color:var(--sys-bd); }
.blk.notif .lbl { color:var(--muted); }
#h-inj { cursor:pointer; }
.toc { display:flex; gap:3px; margin:4px 0 8px; flex-wrap:wrap; }
.toc .tchip2 { cursor:pointer; font-size:11.5px; padding:1px 6px; border-radius:5px; border:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:56px; }
.scard { border:1px solid var(--line); border-left:5px solid var(--cat); border-radius:7px; margin:4px 0; background:var(--panel); }
.scard-h { cursor:pointer; display:flex; flex-wrap:wrap; align-items:center; gap:3px 8px; padding:4px 8px; }
.scard-h .st { font-weight:600; }
.scard-h .first { color:var(--muted); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1 1 200px; min-width:0; }
.scard.open .first { display:none; }
.scard-b { display:none; padding:2px 10px 8px; }
.scard.open .scard-b { display:block; }
.cat { font-size:11px; border-radius:8px; padding:0 6px; color:#fff; background:var(--cat); }
.sblock { margin:6px 0 10px; }
.sblock-h { font-weight:600; font-size:13px; margin:6px 0 2px; }

/* v6: session sections and charts */
[hidden] { display:none !important; }
.secbar { display:flex; gap:8px; align-items:center; margin:2px 0 4px; flex-wrap:wrap; }
.ssec { background:var(--bg); border:1px solid var(--line); border-radius:10px; margin-bottom:8px; }
.ssec.scol { border-left:6px solid var(--sess); }
.ssec-h { cursor:pointer; padding:7px 12px; display:flex; flex-direction:column; gap:2px; background:var(--panel); border-radius:10px; user-select:none; }
.ssec.open > .ssec-h { border-radius:10px 10px 0 0; border-bottom:1px solid var(--line); }
.ssec-h .l1, .ssec-h .l2 { display:flex; flex-wrap:wrap; gap:3px 10px; align-items:center; min-width:0; }
.ssec-h .l2 { font-size:12.5px; }
.ssec-h .sname { font-size:14.5px; }
.ssec-h .sprompt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1 1 200px; }
.ssec-h .slive { color:var(--res); font-weight:600; font-size:12.5px; }
.chev::before { content:"▸"; color:var(--muted); }
.ssec.open .chev::before { content:"▾"; }
.ssec-b { display:none; padding:8px 8px 4px; }
.ssec.open > .ssec-b { display:block; }
.ssec-rows { display:flex; flex-direction:column; gap:6px; }
.charts { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:8px; }
.cbox { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 8px; max-width:100%; }
.ctitle { font-weight:600; font-size:12.5px; margin-bottom:2px; }
svg.chart { display:block; max-width:100%; height:auto; }
svg.chart .cgrid { stroke:var(--line); stroke-width:1; }
svg.chart .caxis { fill:var(--muted); font-size:9.5px; font-family:ui-monospace, Menlo, monospace; }
svg.chart .cmuted { fill:var(--muted); font-size:12px; }
svg.chart .cinj { fill:#b45309; font-size:10px; font-weight:700; }
svg.chart .cbar { cursor:pointer; }
svg.chart .cbar:hover rect:not([fill="transparent"]) { opacity:.8; }
.clegend { display:flex; flex-wrap:wrap; gap:3px 10px; font-size:11.5px; color:var(--muted); margin-top:2px; }
.clegend i, .sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
.clegend i.striped { background:repeating-linear-gradient(45deg, #6b7280 0 3px, transparent 3px 6px); border:1px solid #6b7280; }

/* v5: right-to-left text, cost */
code, pre, .json, .tsum, .c-call, .tname { unicode-bidi:isolate; }
code { direction:ltr; }
.ptext { white-space:pre-wrap; }
.ptext > div { min-height:1em; }
.pv bdi, .l2 bdi { unicode-bidi:isolate; }
.cost { color:var(--muted); cursor:help; border-bottom:1px dotted var(--faint); white-space:nowrap; }
.cost b { color:var(--ink); font-weight:500; }
#costpop { position:fixed; z-index:60; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px; box-shadow:0 8px 30px rgba(0,0,0,.25); font-size:12.5px; max-width:min(560px, calc(100vw - 24px)); }
#costpop table { border-collapse:collapse; width:100%; }
#costpop td, #costpop th { padding:2px 6px; text-align:right; vertical-align:top; white-space:nowrap; }
#costpop td:first-child, #costpop th:first-child { text-align:left; }
#costpop td.ex { white-space:normal; text-align:left; color:var(--muted); min-width:180px; }
#costpop tr.tot td { border-top:1px solid var(--line); font-weight:600; }
#costpop .note { color:var(--muted); margin-top:6px; }

/* v4: conversation view */
.vswitch { display:inline-flex; }
.vswitch .tbtn { border-radius:0; }
.vswitch .tbtn:first-child { border-radius:6px 0 0 6px; }
.vswitch .tbtn:last-child { border-radius:0 6px 6px 0; border-left:none; }

.scardl .l2 { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin:2px 0; }
.scardl .l3 { font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; }
.gdot { width:8px; height:8px; border-radius:50%; background:#22c55e; display:inline-block; }

.cb { max-width:860px; margin:8px 0; }
.cb .blk { margin:0; }

<body>
<header id="hdr">
  <div class="hrow">
    <span class="vswitch" title="Conversation: the chats as the user saw them. Traffic: every request in detail. Keys: c / t"><button id="v-conv" class="tbtn">Conversation</button><button id="v-traffic" class="tbtn">Traffic</button></span>
    <span id="live" class="live off" title="connection to dashboard.py: ● live = receiving the log as it grows; ○ = reconnecting">○ connecting</span>
    <span class="stat" id="h-req" title="requests seen; bg = sent by Claude Code itself, not by you"></span>
    <span class="stat" id="h-tok"></span>
    <span id="h-err" class="hcount" title="main requests that failed (non-2xx status, stream error, proxy error, or no message_stop). Click: errors only"></span>
    <span id="h-bgerr" class="hcount gray" title="background requests (sent by Claude Code itself, not by you) that failed; they do not raise the red count. Click: errors only"></span>
    <span id="h-inj" class="hcount zero" title="⚠ possible injection: a hint, not proof: the phrase appears in a tool result. Click: show only those rows"></span>
    <span id="h-hidden" class="c-muted"></span>
    <span class="spacer"></span>
    <span class="legend-key" title="the four main kinds use the same color everywhere">
      <span><i class="kdot you"></i>You</span><span><i class="kdot model"></i>Model</span><span><i class="kdot call"></i>tool call</span><span><i class="kdot res"></i>tool result</span>
    </span>
  </div>
  <div class="hrow">
    <span class="c-muted tonly" title="tool calls by name, over all replies; click a chip to filter">tools:</span>
    <span class="toolchips tonly" id="h-tools"></span>
    <span class="spacer"></span>
     <input type="search" dir="auto" id="q" placeholder="search  ( / )" title="case-insensitive search over prompts, model text, tool inputs and tool results">
    <select class="tonly" id="f-session" title="show only the rows of one claude session"><option value="">all sessions</option></select>
    <select class="tonly" id="f-tool" title="show only rows with a call or result of this tool"><option value="">all tools</option></select>
    <select class="tonly" id="f-model" title="show only rows answered by this model"><option value="">all models</option></select>
  </div>
  <div class="hrow">
    <button class="tbtn tonly" id="b-err" title="show only failed requests">errors only</button>
    <button class="tbtn tonly" id="b-bg" title="hide requests sent by Claude Code itself, not by you (startup probes, suggestions, summaries)">hide background</button>
    <button class="tbtn on tonly" id="b-follow" title="on: while you are at the top, the newest row stays in view. off: the view never moves on its own">follow live</button>
    <button class="tbtn" id="b-theme" title="theme: auto follows the system; click to override">theme: auto</button>
    <button class="tbtn" id="b-help" title="legend: colors, badges and arrows">?</button>
    <span class="c-muted" style="font-size:12px" title="keyboard shortcuts">c / t views · / search · <span class="tonly">j/k move · Enter open</span><span class="conly">↑/↓ sessions</span></span>
  </div>
</header>
<div id="legend" hidden></div>
<button id="pill" hidden></button>
<div id="convpane">
  <aside id="sesslist"></aside>
  <section id="chatwrap">
    <div id="chathead"></div>
    <div id="chat"></div>
    <button id="chatpill" hidden></button>
  </section>
</div>

    ['bg', '', TIP.bg], ...AUTO_KINDS.map(k => [k.label, '', k.tip]), ['Auto', 'pend', TIP.pend], ['side request', 'auto', TIP.side], ['system changed', 'mark', TIP.sysChanged], ['tools changed', 'mark', TIP.toolsChanged], ['429 …', 'red', 'this request failed (status, stream error, proxy error, or no message_stop)'],
    ['no result yet', 'call', TIP.noResult], ['orphan result', 'redo', TIP.orphan],
    ['Session 2 · Thread 1', 'thread', TIP.session], ['Session 2 · Subagent', 'thread', TIP.subagent], ['⚠ possible injection', 'inj', TIP.inj], ['🔒 permission denied', 'perm', TIP.perm]];
  const tokens = [['sent', 'tokens sent to the model: new input + read from cache + written to cache'], ['received', 'tokens the model wrote (output)'], ['≈ $ est.', 'estimated cost at API list prices; hover for the breakdown. On a subscription you are not billed per token'], ['errors', 'main requests that failed; red'], ['bg errors', 'background requests that failed; gray, never raise the red count']];
  legend.replaceChildren(
    h('div', { style: 'display:flex;justify-content:space-between;align-items:center' }, h('h3', null, 'Legend'), h('button', { class: 'tbtn', onclick: () => legend.hidden = true }, 'close (Esc)')),
    h('h3', null, 'Colors'), h('dl', null, kinds.map(([c, l, d]) => [h('dt', null, h('i', { class: 'kdot ' + c }), l), h('dd', null, d)])),
    h('h3', null, 'Views'), h('dl', null, h('dt', null, 'Conversation'), h('dd', null, 'sessions on the left; the chat as the user saw it: You, a collapsed 🔧 steps line per turn, Claude. ↗ #n opens that request in Traffic'),
      h('dt', null, 'Traffic'), h('dd', null, 'every request, newest first; ↙ chat goes back to the Conversation')),
    h('h3', null, 'Arrows'), h('dl', null, h('dt', null, '→'), h('dd', null, TIP.inArrow), h('dt', null, '←'), h('dd', null, TIP.outArrow)),
    h('h3', null, 'Badges'), h('dl', null, badges.map(([t, c, d]) => [h('dt', null, badge(t, c)), h('dd', null, d)]), h('dt', null, h('span', { class: 'dot' })), h('dd', null, TIP.toolErr), h('dt', null, h('span', { class: 'dot perm' })), h('dd', null, TIP.perm)),
    h('h3', null, 'Background labels (→ line)'), h('dl', null, Object.entries(TIP.bgKind).map(([k, d]) => [h('dt', null, k), h('dd', null, d)]), h('dt', null, '🔔 notification'), h('dd', null, TIP.notif)),
    h('h3', null, 'Numbers'), h('dl', null, tokens.map(([t, d]) => [h('dt', null, t), h('dd', null, d)])),

  );
}
$('#b-help').addEventListener('click', () => { if (legend.hidden) buildLegend(); legend.hidden = !legend.hidden; });
// keyboard (U29)
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#costpop').hidden) { popPinned = null; $('#costpop').hidden = true; return; }
  if (e.key === 'Escape') { if (!legend.hidden) { legend.hidden = true; return; } if (document.activeElement === $('#q')) $('#q').blur(); return; }
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); return; }
  if (e.key === 'c') { setView('conversation'); return; }
  if (e.key === 't') { setView('traffic'); return; }
  if (C.view === 'conversation') {
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && C.order && C.order.length) {
      e.preventDefault();
      let i = C.order.indexOf(C.sess);
      i = e.key === 'ArrowDown' ? Math.min(C.order.length - 1, i + 1) : Math.max(0, i - 1);
      selectSession(C.order[i]);
    }
    return;
  }
  if (e.key === 'j' || e.key === 'k' || e.key === 'Enter') {
    const rows = [...feed.querySelectorAll('.row')].filter(r => r.offsetParent);
    if (!rows.length) return;
    let i = rows.findIndex(r => r.classList.contains('sel'));
    if (e.key === 'Enter') { if (i >= 0) { const ex = S.ex.get(rows[i].dataset.id); toggleExpand(ex); } return; }
    if (i >= 0) rows[i].classList.remove('sel');
    i = e.key === 'j' ? Math.min(rows.length - 1, i + 1) : Math.max(0, i - 1);
    rows[i].classList.add('sel');
    rows[i].scrollIntoView({ block: 'nearest' });
  }
});

document.addEventListener('click', e => { if (popPinned && !e.target.closest('#costpop')) { popPinned = null; $('#costpop').hidden = true; } });
$('#costpop').addEventListener('mouseenter', () => clearTimeout(popTimer));
$('#costpop').addEventListener('mouseleave', () => { if (!popPinned) $('#costpop').hidden = true; });

/* ------------------------------------------------------------------ live stream (S3-S5) */
function resetAll() {
  S.ex.clear(); S.list.length = 0; S.seq = 0; S.sessions.clear(); S.sessOrder.length = 0; S.subByCall.clear(); lastSessKey = ''; S.calls.clear(); S.results.clear(); S.msgIds.clear(); S.newCount = 0;
  added.length = 0; dirty.clear();
  T.secs.clear(); secsEl.replaceChildren();
  feed.prepend(h('div', { class: 'empty', id: 'empty' }, 'The log was reset. Waiting for traffic…'));
  C.sess = null; C.userPicked = false; C.open.clear(); C.listDirty = C.chatDirty = true; if (C.cards) { C.cards.clear(); CV.list.replaceChildren(); }
  lastToolKey = lastModelKey = '';
  schedule();
}
function connect() {
  const live = $('#live');
  const es = new EventSource('/events');
  es.onopen = () => { live.textContent = '● live'; live.className = 'live'; };
  es.onerror = () => { live.textContent = '○ reconnecting'; live.className = 'live off'; };
  es.onmessage = e => { let rec; try { rec = JSON.parse(e.data); } catch (err) { console.warn('bad log line', e.lastEventId); return; } onRecord(rec); };
  es.addEventListener('reset', resetAll);
}
updateHeader();
setView(location.hash === '#traffic' ? 'traffic' : 'conversation', true);
connect();
